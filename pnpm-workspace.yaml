packages:
  - packages/** # ui库、工具库, cli等相关库
  - apps/* # 应用（admin、playground、docs）

# 安全修复：父包把传递依赖精确锁死在有漏洞的版本上，只能通过 overrides 提升
# - concurrently 锁定 shell-quote 1.8.4（CVE-2026-13311 / CVE-2026-102422）
# - oxfmt 锁定 tinypool 2.1.0（CVE-2026-104848 / CVE-2026-104849）
overrides:
  shell-quote: 1.11.0
  tinypool: 2.2.0

allowBuilds:
  '@parcel/watcher': true
  core-js: true
  es5-ext: true
  esbuild: true
  simple-git-hooks: true
  vue-demi: true
